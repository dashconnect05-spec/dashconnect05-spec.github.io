/* =========================================================
   INDEX-ONLY STYLES
   (gallery squares, scroll area — unique to this page)
========================================================= */

#scroll-area {
  flex: 0 1 auto;
  max-height: 74vh;
  overflow-y: auto;
  overflow-x: hidden;
  position: relative;
}

#container {
  position: relative;
  width: 100%;
}

.square {
  position: absolute;
  overflow: hidden;
  border-radius: 14px;
  transition: transform 0.2s ease, opacity 0.25s ease, left 0.35s ease, top 0.35s ease;
  will-change: transform;
  cursor: grab;
  touch-action: none;
}

.square:active {
  cursor: grabbing;
}

.square img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.square.fallback {
  background: linear-gradient(135deg, #444, #222);
  border: 1px solid #555;
  display: flex;
  align-items: center;
  justify-content: center;
}

.square a {
  position: absolute;
  bottom: 5px;
  left: 5px;
  right: 5px;
  font-size: 12px;
  color: white;
  text-decoration: none;
  padding: 4px;
  text-align: center;
}

@media (max-width: 700px) {
  #scroll-area {
    flex: 0 1 auto;
    max-height: 74vh;
    overflow-y: auto;
  }
}

<script>
const container = document.getElementById('container');
const scrollArea = document.getElementById('scroll-area');

let squares = [];
let settings = getSettings();
let isRebuilding = false;

function getSettings() {
  const mobile = window.innerWidth < 700;
  return {
    COLS: mobile ? 2 : 3,
    ROW_GAP: mobile ? 420 : 700,
    COL_GAP: mobile ? 260 : 520,
    TOP_OFFSET: mobile ? 40 : 180,
    SIZE_SCALE: mobile ? 0.8 : 0.95
  };
}

function getSafePosition(index, squareWidth = 200) {
  const mobile = window.innerWidth < 700;

  if (mobile) {
    const containerWidth = scrollArea.clientWidth;
    return {
      x: containerWidth / 2 - 80,
      y: settings.TOP_OFFSET + index * settings.ROW_GAP
    };
  }

  const col = index % settings.COLS;
  const row = Math.floor(index / settings.COLS);
  const containerWidth = scrollArea.clientWidth;
  const totalWidth = settings.COL_GAP * (settings.COLS - 1);
  const startX = (containerWidth - totalWidth) / 2 - 80;
  const randomOffsetX = (Math.random() - 0.5) * 120;
  const randomOffsetY = (Math.random() - 0.5) * 160;

  const maxX = containerWidth - squareWidth - 40;
  const rawX = startX + col * settings.COL_GAP + randomOffsetX;

   return {
  x: Math.min(rawX, maxX),
  y: settings.TOP_OFFSET + row * settings.ROW_GAP + randomOffsetY
};
}

async function loadData() {
  const res = await fetch('data.json');
  const data = await res.json();

  container.style.height =
    (Math.ceil(data.images.length / settings.COLS) * settings.ROW_GAP + 1200) + 'px';

  for (let i = 0; i < data.images.length; i++) {
    createSquare(data.images[i], data.links[i], i);
  }
}

async function createSquare(imgName, linkFile, index) {
  const baseSize = (160 + Math.random() * 120) * settings.SIZE_SCALE;
  const pos = getSafePosition(index, baseSize * 1.2);

  const div = document.createElement('div');
  div.className = 'square';

  const img = document.createElement('img');
  img.src = 'IMAGES/' + imgName;

  const a = document.createElement('a');

  div.style.opacity = "0";
  div.style.left = pos.x + 'px';
  div.style.top = pos.y + 'px';
  div.style.width = baseSize + 'px';
  div.style.height = baseSize + 'px';

  img.onload = () => {
    const ratio = img.naturalWidth / img.naturalHeight;
    let width, height;
    if (ratio > 1) {
      width = baseSize * 1.2;
      height = width / ratio;
    } else {
      height = baseSize * 1.2;
      width = height * ratio;
    }
    div.style.width = width + 'px';
    div.style.height = height + 'px';
  };

  img.onerror = () => div.classList.add('fallback');

  try {
    const txt = await fetch('LINKS/' + linkFile).then(r => r.text());
    a.href = txt.trim();
    a.target = "_blank";
  } catch {}

  let wasDragging = false;

  const squareObj = {
    el: div, x: pos.x, y: pos.y,
    originX: pos.x, originY: pos.y,
    hover: false, dragging: false
  };

  div.addEventListener('mouseenter', () => squareObj.hover = true);
  div.addEventListener('mouseleave', () => squareObj.hover = false);

  let offsetX = 0, offsetY = 0, pointerId = null;

  div.addEventListener('pointerdown', (e) => {
    squareObj.dragging = true;
    wasDragging = false;
    pointerId = e.pointerId;
    offsetX = e.clientX - div.offsetLeft;
    offsetY = e.clientY - div.offsetTop;
    div.setPointerCapture(pointerId);
    div.style.zIndex = 9999;
    e.preventDefault();
  });

  div.addEventListener('pointermove', (e) => {
    if (!squareObj.dragging || e.pointerId !== pointerId) return;
    wasDragging = true;
    const x = e.clientX - offsetX;
    const y = e.clientY - offsetY;
    div.style.left = x + 'px';
    div.style.top = y + 'px';
    squareObj.x = x;
    squareObj.y = y;
  });

  div.addEventListener('pointerup', (e) => {
    if (e.pointerId !== pointerId) return;
    squareObj.dragging = false;
    div.releasePointerCapture(pointerId);
    div.style.zIndex = '';
    div.style.left = squareObj.originX + 'px';
    div.style.top = squareObj.originY + 'px';
    squareObj.x = squareObj.originX;
    squareObj.y = squareObj.originY;
  });

  div.addEventListener('pointercancel', () => {
    squareObj.dragging = false;
    div.style.zIndex = '';
    div.style.left = squareObj.originX + 'px';
    div.style.top = squareObj.originY + 'px';
    squareObj.x = squareObj.originX;
    squareObj.y = squareObj.originY;
  });

  a.addEventListener('click', (e) => {
    if (wasDragging) e.preventDefault();
  });

  div.appendChild(img);
  div.appendChild(a);
  container.appendChild(div);
  squares.push(squareObj);

  requestAnimationFrame(() => { div.style.opacity = "1"; });
}

function updateSquares() {
  const scrollTop = scrollArea.scrollTop;
  const viewportCenter = scrollTop + scrollArea.clientHeight / 2;

  squares.forEach(sq => {
    const distance = Math.abs(viewportCenter - sq.y);
    const range = 500;
    let influence = Math.max(0, Math.min(1, 1 - distance / range));

    let scale, opacity;
    if (sq.hover) {
      scale = 1.7; opacity = 1;
    } else {
      scale = 0.6 + influence * 0.8;
      opacity = 0.2 + influence * 0.8;
    }

    sq.el.style.transform = `scale(${scale})`;
    sq.el.style.opacity = opacity;
  });
}

function animate() {
  if (squares.length > 0) updateSquares();
  requestAnimationFrame(animate);
}

window.addEventListener('resize', () => {
  if (isRebuilding) return;
  isRebuilding = true;
  squares = [];
  container.innerHTML = "";
  settings = getSettings();
  requestAnimationFrame(() => {
    loadData().then(() => { isRebuilding = false; });
  });
});

loadData();
animate();
</script>
